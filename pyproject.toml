[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulsar-exec"
version = "0.1.0"
description = "Pulsar execution layer: shared order semantics on top of pulsar-contracts (state machine, execution events, idempotency)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "vanzeph" }]
requires-python = ">=3.11"
dependencies = [
    "pulsar-contracts @ git+https://github.com/vanzeph/pulsar-contracts.git@f385fbd",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.8",
]

[project.urls]
Repository = "https://github.com/vanzeph/pulsar-exec"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pulsar_exec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

# pulsar-contracts (f385fbd) does not yet ship a py.typed marker; drop the
# marker upstream and this override can go away.
[[tool.mypy.overrides]]
module = "pulsar_contracts.*"
ignore_missing_imports = true
